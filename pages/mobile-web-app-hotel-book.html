            mix-blend-mode: multiply;
            opacity: .06
        }

        @keyframes pulsek {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .25
            }
        }

        .pulse {
            animation: pulsek 1.5s ease-in-out infinite
        }

        @keyframes pop {
            0% {
                transform: scale(.5);
                opacity: 0
            }

            70% {
                transform: scale(1.08)
            }

            100% {
                transform: scale(1);
                opacity: 1
            }
        }

        .checkpop {
            animation: pop .4s cubic-bezier(.2, .8, .3, 1.2) both
        }

        @keyframes fadeup {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .fu {
            animation: fadeup .35s ease
        }

        @keyframes flashk {
            0% {
                box-shadow: 0 0 0 0 rgba(176, 138, 62, 0)
            }

            25%,
            70% {
                box-shadow: 0 0 0 3px rgba(176, 138, 62, .9)
            }

            100% {
                box-shadow: 0 0 0 0 rgba(176, 138, 62, 0)
            }
        }

        .flash {
            animation: flashk 1.3s ease
        }

        .bmk {
            transition: all .2s
        }

        .bmk.booked {
            background: #B08A3E;
            color: #211D16;
            border-color: #B08A3E
        }

        .ups,

            transition: all .15s
        }

        .ups.on {
            background: #1E4636;
            border-color: #1E4636;
            color: #F9F5EA
        }

        .ups.on .up-p {
            color: rgba(249, 245, 234, .55)
        }

        .slot.on {
            background: #211D16;
            border-color: #211D16;
            color: #F9F5EA
        }

        .slot.on .sl-s {
            color: rgba(249, 245, 234, .6)
        }

        #toast {
            position: absolute;
            left: 50%;
            bottom: 92px;
            z-index: 60;
            transform: translate(-50%, 14px);
            opacity: 0;
            pointer-events: none;
            transition: transform .3s cubic-bezier(.2, .8, .2, 1), opacity .3s
        }

        #toast.show {
            transform: translate(-50%, 0);
            opacity: 1
        }

        #pill {
            position: absolute;
            left: 50%;
            bottom: 16px;
            width: calc(100% - 32px);
            max-width: 398px;
            z-index: 40;
            transform: translate(-50%, 0);

        }

        #pill.pillhide {
            transform: translate(-50%, 150%);
            opacity: 0;
            pointer-events: none
        }

        }

            }
            const rows = items.map(({ ev: e, it }) => {
                const tot = itemTotal(e, it), t = fmt(e.s);
                const meta = [e.venue, it.qty > 1 ? `×${it.qty}` : '', it.slot || '', it.ups.map(i => e.upsells[i].n).join(', ')].filter(Boolean).join(' · ');
                return `<div class="flex items-start gap-3 py-3.5 border-b border-line/60">
      <div class="w-10 shrink-0 text-right pt-[1px]"><p class="text-[11.5px] font-bold tabular leading-none">${t.replace(/ (AM|PM)/, '')}</p><p class="text-[8.5px] font-semibold text-ink/40 mt-0.5">${t.slice(-2)}</p></div>
      <div class="w-[3px] rounded-full self-stretch ${BAR[e.cat]}"></div>
      <div class="flex-1 min-w-0">
        <p class="text-[13px] font-semibold leading-snug">${e.title}</p>
        <p class="text-[10.5px] text-ink/50 mt-0.5">${meta}</p>
        ${it.booked ? `<span class="mt-1.5 inline-flex items-center gap-1 text-[9px] font-bold text-house bg-house/10 px-1.5 py-[3px] rounded">${ic('check', 'w-3 h-3')}${it.code} · CONFIRMED</span>` : ''}
      </div>
      <div class="shrink-0 flex flex-col items-end gap-1.5">
        <p class="text-[12px] font-bold tabular">${tot ? `$${tot}` : 'Free'}</p>
        ${it.booked ? '' : `<button data-act="remove" data-id="${e.id}" aria-label="Remove" class="text-ink/25 active:text-tour transition">${ic('trash', 'w-4 h-4')}</button>`}
      </div></div>`;
            }).join('');
            setSheet(head + `<div class="flex-1 overflow-y-auto px-5 pb-2 min-h-0">${rows}${suggestion(items)}
    <div class="flex items-center justify-between pt-4 pb-3">
      <p class="text-[11px] text-ink/50">${un.length ? `${un.length} to confirm` : 'All confirmed'}</p>
      <p class="text-[15px] font-bold tabular">$${total}</p>
    </div></div>
  <div class="shrink-0 border-t border-line bg-paper px-5 pt-3.5 pb-5">
    ${un.length ? `<button data-act="confirmall" class="w-full bg-ink text-cream rounded-full py-3.5 text-[13.5px] font-bold flex items-center justify-center gap-2 active:scale-[.98] transition">Confirm ${un.length} · charge Room 412 ${ic('arrowr', 'w-4 h-4')}</button>
    <p class="text-[9.5px] text-ink/45 text-center mt-2">House events post to your room account · tours are paid to their partners</p>`
                    : `<button data-act="close" class="w-full bg-house text-cream rounded-full py-3.5 text-[13.5px] font-bold active:scale-[.98] transition">All set — done</button>`}
  </div>`);
            showSheet();
        }
        function confirmAll() {
            cart.forEach(it => { if (!it.booked) { it.booked = true; it.code = mkCode() } });
            toast('All confirmed — see you down there.');
            renderPill(); refreshBookmarks(); openMyDay();
        }

        /* ---------- pill & toast ---------- */
        function renderPill() {
            const p = $('#pill'), n = cart.size;
            $('#pillIc').innerHTML = ic('bmk', 'w-[18px] h-[18px]');
            $('#pillChev').innerHTML = ic('chevr', 'w-3.5 h-3.5');
            if (!n) { p.classList.add('pillhide'); return }
            p.classList.remove('pillhide');
            const items = [...cart.entries()];
            const tot = items.reduce((s, [id, it]) => s + itemTotal(byId(id), it), 0);
            const all = items.every(([, it]) => it.booked);
            $('#pillCount').textContent = n;
            $('#pillSub').textContent = all ? `${n} confirmed · $${tot}` : `${n} planned${tot ? ` · $${tot}` : ''}`;
        }
        let toastT;
        function toast(msg) {
            $('#toastIc').innerHTML = ic('check', 'w-3.5 h-3.5');
            $('#toastTx').textContent = msg;
            const t = $('#toast'); t.classList.add('show');
            clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
        }

        /* ---------- actions ---------- */
        function toggleBook(id) {
            const e = byId(id);
            if (cart.has(id)) { cart.delete(id); toast('Removed from My Day') }
            else { cart.set(id, { qty: 2, ups: [], slot: null, booked: false, code: null }); toast(`Added — ${e.title}, ${fmt(e.s)}`) }
            renderPill(); refreshBookmarks();
        }
        function addSoft(id) {
            cart.set(id, { qty: 2, ups: [], slot: null, booked: false, code: null });
            toast(`Added — ${byId(id).title}`);
            renderPill(); refreshBookmarks(); openMyDay();
        }
        document.addEventListener('click', e => {
            const t = e.target.closest('[data-act]'); if (!t) return;
            switch (t.dataset.act) {
                case 'tab':
                    state.day = +t.dataset.i;
                    renderTabs(); renderHero(); renderRail(); renderFeed();
                    $('#scroller').scrollTo({ top: Math.max(0, $('#sbar').offsetTop - 10), behavior: 'smooth' });
                    break;
                case 'filter': state.filter = t.dataset.k; renderFilters(); renderRail(); renderFeed(); break;
                case 'hour': {
                    const h = +t.dataset.h;
                    const el = [...$$('#feed [data-ev]')].find(n => +n.dataset.h >= h && n.dataset.day === String(state.day));
                    if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1400) }
                    else toast('Nothing after that — try another day.');
                    break;
                }
                case 'open': openSheet(t.dataset.id); break;
                case 'book': toggleBook(t.dataset.id); break;
                case 'gotohero': $('#heroSec').scrollIntoView({ behavior: 'smooth' }); break;
                case 'close': hideSheet(); break;
                case 'myday': case 'pill': openMyDay(); break;
                case 'qty': if (cur) { cur.qty = Math.min(8, Math.max(1, cur.qty + +t.dataset.d)); updateNumbers() } break;
                case 'up': if (cur) { const i = +t.dataset.i; cur.ups.has(i) ? cur.ups.delete(i) : cur.ups.add(i); updateNumbers() } break;
                case 'slot': if (cur) { cur.slot = +t.dataset.i; updateNumbers() } break;
                case 'confirm': confirmPrimary(t); break;
                case 'confirmall': confirmAll(); break;
                case 'remove': cart.delete(t.dataset.id); renderPill(); refreshBookmarks(); openMyDay(); break;
                case 'sugadd': addSoft(t.dataset.id); break;
            }
        });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') hideSheet() });
        $('#scroller').addEventListener('scroll', () => { $('#sbar').classList.toggle('sbarsh', $('#scroller').scrollTop > 12) }, { passive: true });

        /* ---------- live clock ---------- */
        setInterval(() => {
            simSec++; sim = simSec / 60;
            $$('[data-cds]').forEach(el => {
                const d = +el.dataset.cds * 60 - simSec;
                if (d <= 0) { el.textContent = 'Underway — come up'; return }
                const h = Math.floor(d / 3600), m = Math.floor(d % 3600 / 60);
                el.textContent = h ? `Begins in ${h}h ${m}m ${pad(d % 60)}s` : `Begins in ${m}m ${pad(d % 60)}s`;
            });
            $$('[data-cdm]').forEach(el => {
                const m = Math.round(+el.dataset.cdm - sim);
                el.textContent = m <= 0 ? 'Starting now' : m < 60 ? `In ${m} min` : `In ${Math.floor(m / 60)}h ${m % 60}m`;
            });
        }, 1000);

        /* ---------- init ---------- */
        renderHeader(); renderTabs(); renderFilters(); renderHero(); renderRail(); renderFeed(); renderPill();
    </script>
</body>

</html>
